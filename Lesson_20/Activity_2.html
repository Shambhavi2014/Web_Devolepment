<html>
    <head>
        <title>Function in Javascript-2</title>
    </head>
    <body>
        <h2>Basic Functions</h2>
        <h3>Subtraction</h3>
        <script>
            function difference_of_three_numbers(){
                let p,q,r,s;
                p=144;
                q=25;
                r=7;
                s=p-q-r;
                return s;
            }
            result=difference_of_three_numbers();
            document.write("The difference of 3 numbers p,q and r is" +result)
        </script>
    </body>
</html>
