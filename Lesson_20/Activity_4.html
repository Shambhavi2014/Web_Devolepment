    <h2>Basic Functions</h2>
    <h3>Subtraction</h3>
    <script>
        function product_of_three_numbers() {
            let p, q, r, s;
            p = 2;
            q = 5;
            r = 7;
            s = p*q*r;
            return s;
        }
        result = product_of_three_numbers();
        document.write("The product of 3 numbers p,q and is" + result)
    </script>
