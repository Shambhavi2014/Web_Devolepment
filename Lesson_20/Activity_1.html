<html>
    <head>
        <title>Functions in Javascript</title>
    </head>
    <body>
        <h2>Basic Functions in Javascript</h2>
        <script>
            function sum_of_two_numbers(){
                let x,y,z;
                x=5;
                y=7;
                z=x+y;
                return z;
            }
            result=sum_of_two_numbers();
            document.write("The sum of two numbers x and y is " +result);
        </script>
    </body>
</html>
