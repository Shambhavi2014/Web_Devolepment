        .topnav {

        .topnav a {
            float: left;
            color: rgb(205, 153, 254);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;

        }

        .topnav a:hover {
            background-color: rgb(184, 229, 252);
            color: black;

        }

        .topnav a:active {
            background-color: rgb(245, 245, 134);
            color: rgb(205, 153, 254);
        }
    </style>

</head>
<center>

    <body>
        <div class="topnav">
            <a class="active" href="Activity_2.html">Home</a>
            <a class="active" href="Menu_2.html">Menu</a>
            <a class="active" href="Gallery_2.html">Gallery</a>

            <div class="topImagetext">

        <center>
            <h1>MCDONALDS</h1>
            <h2>Some Tasty Food at our Restaurant!</h2>
            <section>
                <img class="mySlides" src="burger_1.jpg" style="height:500px; width:500px;">
                <img class="mySlides" src="pizza_1.webp" style="height:500px; width:500px;">
                <img class="mySlides" src="french fries_1.webp" style="height:500px; width:500px;">
            </section>
            <p> Come eat yummy and tasty food!</p>
        </center>
        <script>
            var myIndex = 0;
            carousel();

            function carousel() {
                var i;
                var x = document.getElementsByClassName("mySlides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) { myIndex = 1 }
                x[myIndex - 1].style.display = "block";
                setTimeout(carousel, 3000);
            }
        </script>
    </body>

</html>
