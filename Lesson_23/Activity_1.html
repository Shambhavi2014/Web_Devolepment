<html>
    <head>
        <title>Changing CSS in HTML</title>
        <style>
            h2{
                text-align:center;
            }
            .rectangle{
                border:1px solid black;
                margin:auto;
                width:300px;
                height:200px
            }
            .buttons{
            margin:auto;
            width:200px;
            padding:20px;
            text-align:center;
            }
        </style>
    </head>
    <body>
        <h2>Make Changes to the rectangle</h2>
        <div class="rectangle"></div>
        <div class="buttons">
            <button onclick="changeToCircle()">Make Circle</button>
            <button onclick="hide()">Hide</button>
            <button onclick="show()">Show</button>
        </div>
        <script>
            let shape = document.querySelector(".rectangle")
            function changeToCircle(){
                shape.style.borderRadius ="49%"
            }
            function hide(){
                shape.style.display="none"
            }
            function show() {
                  shape.style.display = "block"
                }
                shape.onmouseenter=function(){
                shape.style.background ="red"
                }
                shape.onmouseleave = function () {
                        shape.style.background = "transparent"
                    }
        </script>
    </body>
</html>
